plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'javaSbTemp1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('dev') {
    group = 'application'
    description = 'Continuously compiles and runs the application with DevTools restart support'

    doLast {
        def wrapper = System.getProperty('os.name').toLowerCase().contains('windows')
                ? 'gradlew.bat'
                : './gradlew'
        def compiler = new ProcessBuilder(wrapper, 'classes', '--continuous', '--no-daemon')
                .directory(project.rootDir)
                .start()
        def application = new ProcessBuilder(wrapper, 'bootRun', '--no-daemon')
                .directory(project.rootDir)
                .start()
        def outputThreads = [
                Thread.start { compiler.inputStream.transferTo(System.out) },
                Thread.start { compiler.errorStream.transferTo(System.err) },
                Thread.start { application.inputStream.transferTo(System.out) },
                Thread.start { application.errorStream.transferTo(System.err) }
        ]

        def stopProcesses = {
            [application, compiler].each { process ->
                if (process.isAlive()) {
                    process.destroy()
                }
            }
        }

        Runtime.runtime.addShutdownHook(new Thread(stopProcesses))
        try {
            application.waitFor()
        } finally {
            stopProcesses()
            outputThreads*.join(5000)
        }
    }
}
